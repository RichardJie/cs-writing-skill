  <rect x="78" y="552" width="1044" height="48" rx="24" fill="#eef5ff"/>
  <text x="600" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#41516a">页面适合放置流程图、实验步骤、研究框架和方法总览</text>
