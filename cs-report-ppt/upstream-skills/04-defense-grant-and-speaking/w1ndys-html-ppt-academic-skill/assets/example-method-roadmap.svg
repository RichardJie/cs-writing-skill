      <text x="72" y="190" text-anchor="middle" font-size="19" fill="#26364f">研究问题</text>
    </g>
    <g transform="translate(332 236)">
      <circle cx="72" cy="94" r="58" fill="#2b79d0"/>
      <text x="72" y="86" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">02</text>
      <text x="72" y="113" text-anchor="middle" font-size="18" fill="#ffffff">数据处理</text>
      <text x="72" y="190" text-anchor="middle" font-size="19" fill="#26364f">样本构建</text>
    </g>
    <g transform="translate(572 236)">
      <circle cx="72" cy="94" r="58" fill="#4092d6"/>
      <text x="72" y="86" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">03</text>
      <text x="72" y="113" text-anchor="middle" font-size="18" fill="#ffffff">模型设计</text>
      <text x="72" y="190" text-anchor="middle" font-size="19" fill="#26364f">方法实现</text>
    </g>
    <g transform="translate(812 236)">
      <circle cx="72" cy="94" r="58" fill="#56a5c9"/>
      <text x="72" y="86" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">04</text>
      <text x="72" y="113" text-anchor="middle" font-size="18" fill="#ffffff">实验评估</text>
      <text x="72" y="190" text-anchor="middle" font-size="19" fill="#26364f">指标分析</text>
    </g>
    <g transform="translate(1052 236)">
      <circle cx="72" cy="94" r="58" fill="#6bb7b2"/>
      <text x="72" y="86" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">05</text>
      <text x="72" y="113" text-anchor="middle" font-size="18" fill="#ffffff">论文贡献</text>
      <text x="72" y="190" text-anchor="middle" font-size="19" fill="#26364f">总结展望</text>
