<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Academic method roadmap slide example</title>
  <desc id="desc">A research roadmap slide showing problem definition, data processing, model design, experiment evaluation, and thesis contribution.</desc>
  <rect width="1200" height="675" fill="#fbfcff"/>
  <text x="76" y="92" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#1f2d46" font-weight="700">技术路线与研究框架</text>
  <text x="78" y="134" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#68758a">从问题定义到实验验证，形成可复现的研究闭环</text>
  <line x1="92" y1="330" x2="1108" y2="330" stroke="#b7c6de" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(92 236)">
      <circle cx="72" cy="94" r="58" fill="#1f5fbf"/>
